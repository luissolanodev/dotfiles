# General
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-ghostty:RGB"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# Windows and panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode and the command prompt
set -g status-keys vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Panes: h/j/k/l focus, C-h/j/k/l resize, H/J/K/L move
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2
bind H swap-pane -t "{left-of}"
bind J swap-pane -t "{down-of}"
bind K swap-pane -t "{up-of}"
bind L swap-pane -t "{right-of}"

# Carried over from zellij
bind f display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind b break-pane
bind t next-layout
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Theme
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_status_position "bottom"
set -g @powerkit_plugins "git,battery,datetime"
set -g @powerkit_reload_config_key "R"

# Plugins live outside the config dir; only this list is tracked.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "fabioluciano/tmux-powerkit"

# Install TPM and plugins on first start
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

run "~/.local/share/tmux/plugins/tpm/tpm"
